[package]
name = "dev-cache"
version = "0.1.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Route disposable development caches through owned, inspectable intercepts"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dev-tools-completion = { version = "0.1.0", path = "../dev-tools-completion" }
dev-tools-command = { path = "../dev-tools-command" }
dev-tools-product = { path = "../dev-tools-product" }
fs2 = "0.4"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "dev-cache"
path = "src/main.rs"
