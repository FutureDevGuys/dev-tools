[[tasks]]
id = "yay"
label = "Yay"
os = ["linux"]
detect_any = ["yay"]
depends_on = []
enabled_by_default = true
category = "system"
report_parser = "yay"
kind = "command"
program = "yay"
args = ["-Syu", "--noconfirm"]
policy_key = "aur_update"
requires_elevation = false
needs_sudo_session = true
interactive = false
external_window = false
shell = false

[[tasks.report_patterns]]
pattern = '^pacman database lock (?P<path>/\S*db\.lck) is present$'
section_key = "package_recovery"
section_title = "Package Recovery Actions"
status = "blocked"
name = "{path}"
before = "-"
after = "-"
note = "pacman database lock is present; verify no package manager is running before clearing stale locks"

[[tasks.pre_commands]]
program = "/bin/sh"
args = [
  "-c",
  'lock_path="${UPDATE_ALL_PACMAN_DB_LOCK:-/var/lib/pacman/db.lck}"; if [ -e "$lock_path" ]; then echo "pacman database lock $lock_path is present" >&2; exit 75; fi',
]

