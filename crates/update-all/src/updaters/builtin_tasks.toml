name = "pipx shared libraries"
before = "-"
after = "-"
note = "pipx refreshed shared libraries"

[[tasks.report_patterns]]
pattern = '^\s*upgrading\s+(?P<name>\S+)(?:\s+from\s+\S+\s+to\s+\S+|\.\.\.)\s*$'
section_key = "pipx_packages"
section_title = "Pipx Package Results"
