args = ["upgrade-all"]
policy_key = "pipx_upgrade"
requires_elevation = false
needs_sudo_session = false
interactive = false
external_window = false
shell = false

[[tasks.report_commands]]
program = "pipx"
args = ["list"]
when = "before_after"
state_pattern = '^\s*package\s+(?P<name>\S+)\s+(?P<version>[^,\s]+),\s+installed using Python\s+.*$'
state_section_key = "pipx_packages"
