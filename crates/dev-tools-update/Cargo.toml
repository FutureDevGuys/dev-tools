[package]
name = "dev-tools-update"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Product-neutral authenticated update orchestration for Dev Tools products"

[dependencies]
base64.workspace = true
http = "1"
dev-tools-product = { version = "0.1.1", path = "../dev-tools-product" }
dev-tools-release = { version = "0.1.0", path = "../dev-tools-release" }
semver = "1"
sha2.workspace = true
regex = "1"
quick-xml = { version = "0.42", default-features = false }
html5gum = { version = "0.8.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

[dev-dependencies]
ed25519-dalek.workspace = true
