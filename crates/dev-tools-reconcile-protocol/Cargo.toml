[package]
name = "dev-tools-reconcile-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Shared typed reconciliation protocol for Dev Tools products"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
sha2.workspace = true

[dev-dependencies]
serde_json = "1"
