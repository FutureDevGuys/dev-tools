[package]
name = "release-admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native release administration for standalone Dev Tools products"

[dependencies]
anyhow = "1"
base64.workspace = true
clap = { version = "4", features = ["derive"] }
dev-tools-command = { path = "../dev-tools-command" }
dev-tools-installation = { path = "../dev-tools-installation" }
dev-tools-product = { path = "../dev-tools-product" }
dev-tools-release = { path = "../dev-tools-release" }
ed25519-dalek.workspace = true
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
semver = "1"
sha2.workspace = true
tar = "0.4"
tempfile = "3"
toml = "0.9"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd = "2"
ed25519-dalek.workspace = true
predicates = "3"
sha2.workspace = true
tempfile = "3"

[[bin]]
name = "release-admin"
path = "src/main.rs"
