[package]
name = "sync-configs"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Manifest-driven, config-only filesystem and structured-overlay convergence"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3"
dev-tools-command = { path = "../dev-tools-command" }
dev-tools-installation = { path = "../dev-tools-installation" }
dev-tools-reconcile-protocol = { path = "../dev-tools-reconcile-protocol" }
globset = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.25", features = ["serde"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "sync-configs"
path = "src/main.rs"
