[package]
name = "dev-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Broker bounded post-login automation credentials"

[dependencies]
anyhow = "1"
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dev-auth"
path = "src/main.rs"

[[bin]]
name = "git-credential-dev-auth"
path = "src/credential_main.rs"

[[bin]]
name = "gh-dev-auth"
path = "src/gh_main.rs"
