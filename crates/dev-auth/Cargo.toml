[package]
name = "dev-auth"
version = "0.3.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Transparent workload-identity broker for Git and GitHub CLI"

[dependencies]
anyhow = "1"
base64.workspace = true
directories = "6"
dev-tools-command = { path = "../dev-tools-command" }
dev-tools-installation = { path = "../dev-tools-installation" }
dev-tools-reconcile-protocol = { path = "../dev-tools-reconcile-protocol" }
dev-tools-release = { path = "../dev-tools-release" }
ed25519-dalek.workspace = true
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = "4.1.6"
rustix = { version = "1", features = ["fs", "process"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2.workspace = true
signature.workspace = true
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "socket", "user"] }

[dev-dependencies]
wait-timeout = "0.2"

[[bin]]
name = "dev-auth"
path = "src/main.rs"
