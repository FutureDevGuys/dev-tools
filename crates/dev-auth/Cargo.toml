[package]
name = "dev-auth"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Transparent workload-identity broker for Git and GitHub CLI"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = "4.1.6"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
signature = "2"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "socket", "user"] }

[dev-dependencies]
wait-timeout = "0.2"

[[bin]]
name = "dev-auth"
path = "src/main.rs"
