[package]
name = "dev-auth"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Policy-authorized workload credentials and native execution"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }
dev-tools-completion = { version = "0.1.0", path = "../dev-tools-completion" }
base64.workspace = true
directories = "6"
dev-tools-command = { path = "../dev-tools-command" }
dev-tools-installation = { path = "../dev-tools-installation" }
dev-tools-privilege = { path = "../dev-tools-privilege" }
dev-tools-product = { path = "../dev-tools-product" }
dev-tools-reconcile-protocol = { path = "../dev-tools-reconcile-protocol" }
dev-tools-release = { path = "../dev-tools-release" }
dev-tools-secret = { path = "../dev-tools-secret" }
ed25519-dalek.workspace = true
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = "4.1.6"
rsa = { version = "0.9.10", default-features = false, features = ["pem", "std"] }
rustix = { version = "1", features = ["fs", "process", "net"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2.workspace = true
signature.workspace = true
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
secret-service = { version = "5.1.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "socket", "user"] }

[dev-dependencies]
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"

[[bin]]
name = "dev-auth"
path = "src/main.rs"
