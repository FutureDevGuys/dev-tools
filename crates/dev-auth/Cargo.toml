[package]
name = "dev-auth"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Broker bounded post-login automation credentials"

[dependencies]
anyhow = "1"
directories = "6"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = "4.1.6"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "net"] }
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dev-auth"
path = "src/main.rs"
