# Preserve an existing credential installation while adding native administrator grants.
# Replace the account and source paths with root-owned files for this machine.
schema = "dev-auth-deployment-v2"
mode = "strong"
channel = "stable"
activation = "inactive"
administrator_policy = "/etc/dev-auth/source/policy.toml"
grant_policy = "/etc/dev-auth/source/administrator-grants-v1.json"

[[users]]
name = "account-name"
config = "/etc/dev-auth/source/users/account-name.toml"

[[credentials]]
slot = "automation"
intent = "preserve"
