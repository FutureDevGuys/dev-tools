# Fictional public example for the explicitly weaker same-native-user boundary.
schema = "dev-auth-administrator-policy-v3"
mode = "user_only"
allowed_users = ["automation"]

[programs]
git = "/usr/bin/git"
gh = "/usr/bin/gh"
ssh = "/usr/bin/ssh"
ssh_keygen = "/usr/bin/ssh-keygen"

[trusted_launchers]
worker = "/usr/local/libexec/automation-worker"

[credentials.providers.primary]
kind = "one_password"
executable = "/usr/bin/op"

[credentials.credential_slots.automation]
provider = "primary"
users = ["automation"]

[credentials.resources.service-token]
credential_slot = "automation"
reference = "op://Example/Service/token"
kind = "exportable"
purposes = ["read"]
projections = ["stdin"]

[credentials.resource_caps.worker]
users = ["automation"]

[credentials.resource_caps.worker.resources.service-token]
purposes = ["read"]
projections = ["stdin"]

[workload_caps.worker]
users = ["automation"]
resource_cap = "worker"
launchers = ["worker"]
admission = ["approval_required"]
max_duration_seconds = 86400
