[package]
name = "artifact-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Standalone, configuration-driven artifact update client"

[dependencies]
dev-tools-product = { version = "0.1.0", path = "../dev-tools-product" }
dev-tools-update = { version = "0.1.0", path = "../dev-tools-update" }
directories = "6"
serde = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dev-tools-command = { version = "0.1.0", path = "../dev-tools-command" }
tempfile = "3"

[[bin]]
name = "artifact-update"
path = "src/main.rs"
