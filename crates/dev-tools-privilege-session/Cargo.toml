[package]
name = "dev-tools-privilege-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Product-neutral bounded administrator lease lifecycle"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process", "event", "time"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
