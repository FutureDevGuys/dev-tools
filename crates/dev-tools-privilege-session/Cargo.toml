[package]
name = "dev-tools-privilege-session"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Product-neutral bounded administrator lease lifecycle"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event", "fs", "poll", "process", "signal", "term", "time", "user"] }
rustix = { version = "1", features = ["fs", "process"] }
