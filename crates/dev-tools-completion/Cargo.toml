[package]
name = "dev-tools-completion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Static shell rendering for product-owned Clap command definitions"

[dependencies]
clap = { version = "4", default-features = false, features = ["std"] }
clap_complete = { version = "4", default-features = false }

[dev-dependencies]
dev-tools-command = { version = "0.1.0", path = "../dev-tools-command" }
tempfile = "3"
