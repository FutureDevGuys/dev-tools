[package]
name = "dev-tools-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Product-neutral executable discovery, PATH composition, and bounded execution for Dev Tools"

[dependencies]
anyhow = "1"
tempfile = "3"
wait-timeout = "0.2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
