[package]
name = "dev-tools-release"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Authenticated release verification and stable-channel selection for Dev Tools products"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
ureq = "3.4"

[dev-dependencies]
tempfile = "3"
