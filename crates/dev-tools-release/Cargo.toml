[package]
name = "dev-tools-release"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Authenticated release verification and stable-channel selection for Dev Tools products"

[dependencies]
anyhow = "1"
base64.workspace = true
dev-tools-installation = { version = "0.1.0", path = "../dev-tools-installation" }
ed25519-dalek.workspace = true
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2.workspace = true
ureq = "3.4"
url = "2"

[dev-dependencies]
tempfile = "3"
